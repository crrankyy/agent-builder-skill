name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check JSON syntax
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json; do
            jq empty "$f" && echo "ok: $f"
          done

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Claude Code (latest)
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          claude --version

      - name: Validate marketplace manifest
        run: claude plugin validate . --strict

      - name: Validate plugin manifest
        run: claude plugin validate .claude-plugin/plugin.json --strict

  checks:
    name: Skill checks and hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install check dependencies
        run: pip install pyyaml

      - name: Frontmatter, description budget, version vs CHANGELOG
        run: python scripts/check_repo.py

      - name: Plan guard unit tests
        run: python -m unittest discover -s tests -v

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
