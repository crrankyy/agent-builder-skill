name: Trigger report
description: The skill started when it shouldn't have, or didn't start when it should have.
labels: [triggering]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong?
      options:
        - It started on a prompt that isn't about planning a new agent
        - It didn't start on a prompt that is about planning a new agent
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Exact prompt
      description: The message you typed (redact anything private).
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `claude --version`, and the agent-builder version.
