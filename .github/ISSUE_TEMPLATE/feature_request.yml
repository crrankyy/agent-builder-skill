name: Feature request
description: Suggest a new capability, runtime, provider or question.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to plan that agent-builder doesn't handle well today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? If it's a new question, include the options you'd expect.
    validations:
      required: true
  - type: checkboxes
    id: contract
    attributes:
      label: Core contract
      options:
        - label: This keeps "Claude recommends, the user decides every question" intact.
          required: true
